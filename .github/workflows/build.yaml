name: Publish to Exchange & Deploy to CH2.0

on:
  push:
    branches: [ Develop ]
  pull_request:
    branches: [ Develop, QA, Production ]  # Specify branches for PRss
    

jobs:         
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Set environment variables
        id: set_env
        run: |
          echo "env=${{ github.event_name == 'push' && 'Develop' || github.base_ref == 'qa' && 'QA' || 'Production' }}" >> $GITHUB_ENV
          echo "app_name_suffix=${{ github.event_name == 'push' && '-dev' || github.base_ref == 'qa' && '-qa' || '-production' }}" >> $GITHUB_ENV
          echo "DEVELOP_VERSION=${{ vars.DEVELOP_VERSION }}" >> $GITHUB_ENV
          echo "QA_VERSION=${{ vars.QA_VERSION }}" >> $GITHUB_ENV
          echo "PRODUCTION_VERSION=${{ vars.PRODUCTION_VERSION }}" >> $GITHUB_ENV
          echo "ARTIFACT_ID_PREFIX=${{ vars.artifactId_prefix }}" >> $GITHUB_ENV

      - name: Print Retrieved Values
        run: |
          echo "Develop Version: $DEVELOP_VERSION"
          echo "QA Version: $QA_VERSION"
          echo "Production Version: $PRODUCTION_VERSION"
          echo "Artifact ID Prefix: $ARTIFACT_ID_PREFIX"

      - name: Set artifactId based on Target Branch
        run: |
          # Determine target branch based on event type
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            TARGET_BRANCH="$GITHUB_BASE_REF"
          else
            TARGET_BRANCH=$(echo "$GITHUB_REF" | sed 's|refs/heads/||')
          fi
          echo "Target Branch: $TARGET_BRANCH"

          # Determine the correct version variable based on the branch
          if [[ "$TARGET_BRANCH" == "Develop" ]]; then
            TARGET_VERSION=${{ vars.DEVELOP_VERSION }}
          elif [[ "$TARGET_BRANCH" == "QA" ]]; then
            TARGET_VERSION=${{ vars.QA_VERSION }}
          elif [[ "$TARGET_BRANCH" == "Production" ]]; then
            TARGET_VERSION=${{ vars.PRODUCTION_VERSION }}
          else
            echo "Unknown branch. Exiting..."
            exit 1
          fi

          echo "Current Version for $TARGET_BRANCH: $TARGET_VERSION"
 
          # Increment version
          MAJOR=$(echo $TARGET_VERSION | cut -d. -f1)
          MINOR=$(echo $TARGET_VERSION | cut -d. -f2)
          PATCH=$(echo $TARGET_VERSION | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          echo "New Version for $TARGET_BRANCH: $NEW_VERSION"

          # Set environment variables for use in the pipeline
          echo "artifactId=${{ vars.artifactId_prefix }}${{ env.app_name_suffix }}" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update pom.xml with new artifactId and version
        run: |
          sed -i "0,/<artifactId>.*<\/artifactId>/s|<artifactId>.*</artifactId>|<artifactId>${{ env.artifactId }}</artifactId>|" pom.xml
          sed -i "0,/<version>.*<\/version>/s|<version>.*</version>|<version>${{ env.NEW_VERSION }}</version>|" pom.xml
          
          echo "Updated pom.xml:"
          cat pom.xml
          
      - name: Publish to Exchange
        run: |
          mvn deploy --settings .maven/settings.xml -DskipMunitTests \
          -Dclient.id="${{ secrets.CONNECTED_APP_CLIENT_ID }}" \
          -Dclient.secret="${{ secrets.CONNECTED_APP_CLIENT_SECRET }}" \
          -Denv=${{ env.env }} \
          -Dapp.name=${{ vars.artifactId_prefix }} \
          -Dapp.nameSuffix=${{ env.app_name_suffix }}

      - name: Deploy to CloudHub 2.0
        run: |
          mvn deploy --settings .maven/settings.xml -DskipMunitTests -DmuleDeploy \
          -Dclient.id="${{ secrets.CONNECTED_APP_CLIENT_ID }}" \
          -Dclient.secret="${{ secrets.CONNECTED_APP_CLIENT_SECRET }}" \
          -Denv=${{ env.env }} \
          -Dapp.name=${{ vars.artifactId_prefix }} \
          -Dapp.nameSuffix=${{ env.app_name_suffix }}
 
      - name: Update GitHub environment variables with new version and artifactId
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            TARGET_BRANCH="$GITHUB_BASE_REF"
          else
            TARGET_BRANCH=$(echo "$GITHUB_REF" | sed 's|refs/heads/||')
          fi
          echo "Target Branch: $TARGET_BRANCH"
          if [[ "$TARGET_BRANCH" == "Develop" ]]; then
            VAR_NAME="DEVELOP_VERSION"
          elif [[ "$TARGET_BRANCH" == "QA" ]]; then
            VAR_NAME="QA_VERSION"
          elif [[ "$TARGET_BRANCH" == "Production" ]]; then
            VAR_NAME="PRODUCTION_VERSION"
          else
            echo "Unknown branch. Skipping update."
            exit 1
          fi

          echo "Updating GitHub variable $VAR_NAME with value: $NEW_VERSION"

          curl --location --request PATCH "https://api.github.com/repos/${{ github.repository }}/actions/variables/$VAR_NAME" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "{\"name\":\"$VAR_NAME\",\"value\":\"$NEW_VERSION\"}"
 